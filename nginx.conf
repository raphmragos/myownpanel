worker_processes auto;
error_log /dev/stdout info;
access_log /dev/stdout;

events { worker_connections 2048; multi_accept on; }

http {
    include mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080;
        server_name _;

        # ✅ Panel page
        location / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # ✅ TROJAN
        location ^~ /virgozki       { proxy_pass http://127.0.0.1:10000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /virgozki-hu    { proxy_pass http://127.0.0.1:10001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /virgozki-xhttp { proxy_pass http://127.0.0.1:10002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 86400; }

        # ✅ VMESS
        location ^~ /vmess-virgozki       { proxy_pass http://127.0.0.1:10003; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /vmess-virgozki-hu    { proxy_pass http://127.0.0.1:10004; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /vmess-virgozki-xhttp { proxy_pass http://127.0.0.1:10005; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 86400; }

        # ✅ VLESS
        location ^~ /vless-virgozki       { proxy_pass http://127.0.0.1:10006; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /vless-virgozki-hu    { proxy_pass http://127.0.0.1:10007; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /vless-virgozki-xhttp { proxy_pass http://127.0.0.1:10008; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 86400; }

        # ✅ SHADOWSOCKS
        location ^~ /ss-virgozki       { proxy_pass http://127.0.0.1:10009; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /ss-virgozki-hu    { proxy_pass http://127.0.0.1:10010; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 86400; }
        location ^~ /ss-virgozki-xhttp { proxy_pass http://127.0.0.1:10011; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 86400; }
    }
}
